version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gramcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gramcare
      POSTGRES_USER: gramcare_user
      POSTGRES_PASSWORD: gramcare_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramcare_user -d gramcare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gramcare_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gramcare_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MinIO bucket initialiser ──────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: gramcare_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/gramcare-media;
      mc mb --ignore-existing local/gramcare-docs;
      mc policy set download local/gramcare-docs;
      echo 'MinIO buckets ready.';
      "
    restart: on-failure

  # ── FastAPI backend + Socket.IO (WebRTC signaling + chat) ─────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramcare_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gramcare_user:gramcare_password@postgres:5432/gramcare
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CONSOLE_OTP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── coturn (TURN server for NAT traversal) ────────────────────────────────
  # Optional: calls connect peer-to-peer over WebRTC without a media server;
  # coturn is only a relay-of-last-resort when both sides are behind strict
  # NAT. Free/self-hosted. Set TURN_ENABLED=true in .env once this is up.
  coturn:
    image: coturn/coturn:latest
    container_name: gramcare_coturn
    restart: unless-stopped
    network_mode: host   # TURN requires host networking
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --lt-cred-mech
      --user=gramcare:gramcarepass
      --realm=gramcare.local
      --no-dtls
      --no-tls

volumes:
  postgres_data:
  redis_data:
  minio_data:
